<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<script>
(function () {
  var p = new URLSearchParams(location.search).get("p");
  var target = (p && /^\d+$/.test(p))
    ? "https://wuxinan.wordpress.com/?p=" + p
    : "https://wuxinan.wordpress.com/";
  location.replace(target);
})();
</script>
</head>
<body>
<p>Redirecting to <a href="https://wuxinan.wordpress.com/">https://wuxinan.wordpress.com/</a>…</p>
</body>
</html>
